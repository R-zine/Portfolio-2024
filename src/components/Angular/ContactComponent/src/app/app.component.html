<div [class]="{ content: true, faded: isFaded }">
  <form
    *ngIf="!isEmailSent"
    class="form"
    [formGroup]="contactForm"
    (ngSubmit)="sendEmail()"
    novalidate
  >
    <div>
      <div
        aria-hidden="true"
        [ngClass]="{ 'submit-active': contactForm.controls.name.valid }"
      ></div>
      <label class="sr-only" for="contact-name">Name</label>
      <input
        id="contact-name"
        name="name"
        placeholder="Name"
        type="text"
        autocomplete="name"
        formControlName="name"
        required
      />
    </div>
    <div>
      <div
        aria-hidden="true"
        [ngClass]="{ 'submit-active': contactForm.controls.email.valid }"
      ></div>
      <label class="sr-only" for="contact-email">Email</label>
      <input
        id="contact-email"
        name="email"
        placeholder="Email"
        type="email"
        autocomplete="email"
        formControlName="email"
        required
      />
    </div>
    <div>
      <div
        aria-hidden="true"
        [ngClass]="{ 'submit-active': contactForm.controls.subject.valid }"
      ></div>
      <label class="sr-only" for="contact-subject">Subject</label>
      <input
        id="contact-subject"
        name="subject"
        placeholder="Subject"
        formControlName="subject"
        required
      />
    </div>
    <div>
      <div
        aria-hidden="true"
        [ngClass]="{ 'submit-active': contactForm.controls.message.valid }"
      ></div>
      <label class="sr-only" for="contact-message">Message</label>
      <textarea
        id="contact-message"
        name="message"
        placeholder="Message (at least 30 characters)"
        formControlName="message"
        minlength="30"
        required
      ></textarea>
    </div>
    <div>
      <div
        aria-hidden="true"
        [ngClass]="{ 'submit-active': contactForm.valid }"
      ></div>
      <button
        class="send-btn button"
        [class.disabled]="contactForm.invalid || isSending"
        [disabled]="contactForm.invalid || isSending"
        type="submit"
      >
        {{ isSending ? 'Sending…' : 'Send' }}
      </button>
    </div>
    <p *ngIf="errorMessage" class="form-error" role="alert">
      {{ errorMessage }}
    </p>
  </form>

  <section *ngIf="isEmailSent" class="sent" role="status">
    <div>Email sent</div>
  </section>

  <div aria-hidden="true">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>
  <section class="socials" aria-label="Social profiles">
    <a
      class="ng-button button"
      href="https://github.com/R-zine"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ivan Radev on GitHub"
    >
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        height="16"
        width="15.5"
        viewBox="0 0 496 512"
      >
        <path

    <a
      class="ng-button button"
      href="https://www.linkedin.com/in/ivan-radev/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ivan Radev on LinkedIn"
    >
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        height="16"
        width="14"
        viewBox="0 0 448 512"
      >
        <path

        />

    </a>
  </section>
</div>
